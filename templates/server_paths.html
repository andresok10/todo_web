<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server · Todo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='todo-compacto.css', v='6') }}">
</head>
<body>
    <header class="app-header">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">t.</span>
            <div><h1>Tus herramientas</h1><p class="subtitle">Tu día, un poco más fácil.</p></div>
        </div>
        <nav aria-label="Herramientas">
            <a href="{{ url_for('calendario.calendario_app', panel='calculadoras') }}">Calculadoras</a>
            <a href="{{ url_for('calendario.calendario_app', panel='descargas') }}">Descargas</a>
            <a href="{{ url_for('calendario.calendario_app', panel='calendario') }}">Calendario</a>
            <a href="{{ url_for('descargas_ok.listar_rutas_servidor') }}" aria-current="page">Server</a>
        </nav>
    </header>
    <main class="descarga-container">
        <div class="card-heading"><div><h2>Archivos y carpetas de la app en Render</h2><p>Ruta del proyecto: {{ raiz }}</p></div></div>
        <ul class="server-rutas">
            {% for elemento in rutas %}
            <li><strong>{{ elemento.tipo }}:</strong> <code>{{ elemento.ruta }}</code></li>
            {% endfor %}
        </ul>
    </main>
    <footer>Todo · Hecho para tu día a día</footer>
</body>
</html>
